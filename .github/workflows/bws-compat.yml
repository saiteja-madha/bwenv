name: Official bws compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install latest official bws
        run: cargo install bws --locked
      - name: Verify wrapped command contract
        run: ./scripts/check-bws-compat.sh
